.scene-languages .copy{top:139px;width:1120px}.scene-languages .copy h1{font-size:52px;white-space:normal;max-width:1000px;margin-bottom:13px}.scene-languages .copy p{font-size:20px;max-width:1050px}.language-list{position:absolute;top:326px;left:64px;width:295px;display:flex;gap:11px 9px;flex-wrap:wrap}.language-list span{font-size:16px;line-height:1;border:1px solid #cdd8c7;border-radius:8px;padding:12px 14px;background:#ffffff70}.language-list .active{background:var(--green);color:white;border-color:var(--green)}.language-list small{display:block;margin-top:15px;font-size:15px;line-height:1.65;color:var(--muted)}.language-shot{position:absolute;border-radius:10px;box-shadow:0 13px 20px #243f3417;overflow:hidden;border:1px solid #dde2d5}.language-shot img{width:100%}.language-shot.ja{width:255px;left:404px;top:324px}.language-shot.fr{width:255px;left:677px;top:287px}.language-shot.zh{width:255px;left:950px;top:324px}.language-caption{position:absolute;font-size:12px;letter-spacing:1px;color:var(--muted)}
.social.art{width:1280px;height:640px}.social .copy{top:157px;width:450px}.social .copy h1{font-size:56px}.social .copy p{font-size:20px}.social .main-note{left:620px;top:139px;width:590px}.social .small-note{display:none}.social .back-plane{height:490px;top:100px}.social .foot{bottom:25px}.social .proof{margin-top:23px}.social .edition{letter-spacing:1px}.portrait.art{width:1080px;height:1440px}.portrait .top{left:70px;right:70px;top:54px}.portrait .brand{font-size:28px}.portrait .brand img{width:52px;height:52px}.portrait .edition{font-size:14px}.portrait .copy{left:76px;top:193px;width:900px}.portrait .copy h1{font-size:82px;line-height:1.2}.portrait .copy p{font-size:29px;max-width:880px}.portrait .eyebrow{font-size:17px}.portrait .main-note{left:70px;top:590px;width:940px}.portrait .small-note,.portrait .back-plane{display:none}.portrait .proof{font-size:22px;gap:21px;margin-top:38px}.portrait .foot{bottom:40px;left:76px;right:76px;font-size:17px}.portrait .proof span+span:before{padding-right:21px}.logo.art{width:240px;height:240px;background:#f8f7ef;display:flex;align-items:center;justify-content:center}.logo img{width:194px;height:194px}.logo.large{width:512px;height:512px}.logo.large img{width:420px;height:420px}
.portrait .main-note{left:130px;top:740px;width:820px}.wide-canvas{width:1920px;height:1080px;background:var(--paper);position:relative}.wide-canvas .art{transform:scale(1.3);transform-origin:0 0;position:absolute;left:134px;top:46px}.itch.art{width:630px;height:500px}.itch .top{left:30px;right:30px;top:24px}.itch .brand{font-size:21px}.itch .brand img{width:36px;height:36px}.itch .edition{display:none}.itch .copy{left:34px;top:111px;width:220px}.itch .copy h1{font-size:34px;letter-spacing:-1px;line-height:1.2}.itch .copy p{font-size:15px;line-height:1.65;width:205px}.itch .eyebrow,.itch .proof,.itch .small-note,.itch .back-plane{display:none}.itch .main-note{left:271px;top:127px;width:335px}.itch .foot{left:34px;right:30px;bottom:22px;font-size:11px}.itch .foot .url{display:none}.copy p{white-space:pre-line}
.gallery{padding:50px;max-width:1450px;margin:auto}.gallery h1{font-weight:600;font-size:40px;letter-spacing:-1.5px;margin:0 0 12px}.gallery p{color:var(--muted);max-width:900px;line-height:1.7}.toolbar{display:flex;gap:10px;margin:24px 0}.toolbar a{padding:10px 16px;border:1px solid #bccabb;border-radius:8px;color:var(--green);background:white;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}.tile{display:block;color:inherit;text-decoration:none}.tile img{width:100%;border:1px solid #d5dece;border-radius:12px}.tile strong{display:block;margin:12px 0 4px;font-weight:600}.tile small{color:var(--muted)}.gallery footer{margin-top:36px;font-size:13px;color:var(--muted)}@media(max-width:800px){.gallery{padding:24px}.grid{grid-template-columns:1fr}}body.capture{width:max-content;overflow:hidden}
</style>
<main id="root"></main>
<script>
const q=new URLSearchParams(location.search), scene=q.get('scene'), lang=q.get('lang')==='zh'?'zh':'en', format=q.get('format')||'ph';
const cn=lang==='zh', locale=cn?'zh-Hans':'en-US';
const messages={
 en:{hero:['A thought,\nwithin reach.','Native Windows sticky notes. Pin a reminder, capture an idea, and get back to what matters.'],notes:['Make a little\nroom for ideas.','Rich text, to-do items, and a place for the thought you want to keep in view.'],shortcuts:['A new note.\nOne shortcut.','Create and switch notes from anywhere. Choose your own key combinations in Settings.'],tray:['Quiet on the desktop.\nReady in the tray.','Pin a note, fold it into a small reminder, or bring it back when you need it.'],languages:['Seven languages. One familiar workflow.','Your notes, with an interface that feels at home. Switch languages without restarting.'],tag:'Windows 10 / 11 · Free & open source',proof:['Local storage','No account','7 languages'],eyebrows:{hero:'A small space to think',notes:'01 / Write',shortcuts:'02 / Jump',tray:'03 / Keep nearby',languages:'04 / Feel at home'},foot:'v0.6.0 · Actual app controls with sample content',fold:'A full note.\nA little reminder.',detail:'Detail from global shortcut settings',new:'New note',next:'Next note',languageNote:'English · 简体中文 · 繁體中文\nFrançais · Español · Português · 日本語'},
 zh:{hero:['让灵感，\n留在手边。','原生 Windows 桌面便签。\n记下想法，留住提醒。\n一次，只专注眼前的一件事。'],notes:['给想法，\n留一点位置。','富文本、待办事项和随手记录。把需要记住的内容，留在看得见的地方。'],shortcuts:['一组快捷键，\n马上记下来。','随时新建、依次切换便签。组合键由你定义，隐藏与折叠的便签也能唤出。'],tray:['桌面上的提醒，\n托盘里的秩序。','一键置顶，折叠为小图标。用右下角菜单，轻松管理每一张便签。'],languages:['七种语言，同一种顺手。','界面跟随你的习惯。保存语言设置后即时切换，无需重启。'],tag:'Windows 10 / 11 · 免费开源',proof:['本地保存','无需账号','七种语言'],eyebrows:{hero:'为专注，留一点空白',notes:'01 / 随手记录',shortcuts:'02 / 键盘直达',tray:'03 / 留在身边',languages:'04 / 用熟悉的语言'},foot:'v0.6.0 · 真实控件与示例便签渲染',fold:'一张完整便签\n一个小小提醒',detail:'全局快捷键设置局部',new:'新建便签',next:'切换便签',languageNote:'简体中文 · 繁體中文 · English\nFrançais · Español · Português · 日本語'}
};
const m=messages[lang], root=document.getElementById('root'), icon='logo.png';
const raw=(name,l=locale)=>`raw/${name}-${l}.png`;
const proof=`<div class="proof">${m.proof.map(x=>`<span>${x}</span>`).join('')}</div>`;
const keys=(last,label)=>`<div class="key-block"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>${last}</kbd><em>${label}</em></div>`;
if(scene){
 document.body.classList.add('capture');document.documentElement.lang=cn?'zh-CN':'en';
 if(scene==='logo'){root.innerHTML=`<div class="art logo ${format==='large'?'large':''}"><img src="${icon}" alt="DeskStickyNotes app icon"></div>`;}
 else {
 const kind=m[scene]?scene:'hero';
 let visual='';
 if(kind==='hero'||kind==='notes')visual=`<div class="back-plane"></div><img class="native small-note" src="${raw('note-300')}" alt="Compact green note"><img class="native main-note" src="${raw('note-540')}" alt="Sticky note with sample to-do items">`;
 if(kind==='shortcuts')visual=`<div class="shortcut-window"><img src="${raw('shortcuts')}" alt="Global shortcut settings"></div><div class="detail-label">${m.detail}</div>`;
 if(kind==='tray')visual=`<div class="tray-plane"></div><img class="folded" src="${raw('collapsed')}" alt="Collapsed note icon"><div class="fold-label">${m.fold.replace('\n','<br>')}</div><img class="tray-image" src="${raw('tray')}" alt="Tray menu">`;
 if(kind==='languages')visual=`<div class="language-list">${['English','简体中文','繁體中文','Français','Español','Português','日本語'].map((x,i)=>`<span class="${i===0?'active':''}">${x}</span>`).join('')}<small>${cn?'也可以跟随系统语言。':'Or follow your system language.'}</small></div><div class="language-shot ja"><img src="${raw('settings','ja-JP')}" alt="Japanese settings"></div><div class="language-shot fr"><img src="${raw('settings','fr-FR')}" alt="French settings"></div><div class="language-shot zh"><img src="${raw('settings','zh-Hant')}" alt="Traditional Chinese settings"></div>`;
 const extra=kind==='shortcuts'?keys('N',m.new)+keys('PageDown',m.next):kind==='tray'?`<div class="pin-line"><span>${cn?'置顶':'Pin'}</span><span>${cn?'折叠':'Fold'}</span><span>${cn?'还原':'Restore'}</span></div>`:kind==='languages'?'':proof;
 root.innerHTML=`<article class="art ${cn?'cn':''} ${format==='social'?'social':format==='portrait'?'portrait':format==='itch'?'itch':''} scene-${kind}"><header class="top"><div class="brand"><img src="${icon}" alt="">DeskStickyNotes</div><div class="edition">${m.tag}</div></header><div class="copy"><div class="eyebrow">${m.eyebrows[kind]}</div><h1>${m[kind][0]}</h1><p>${m[kind][1]}</p>${extra}</div>${visual}<footer class="foot"><span>${m.foot}</span><span class="url">github.com/ht7850142/DeskStickyNotes</span></footer></article>`;
 if(format==='wide'){const board=root.firstElementChild;const canvas=document.createElement('div');canvas.className='wide-canvas';root.appendChild(canvas);canvas.appendChild(board);}
 }
}else{
 const entries=['hero','notes','shortcuts','tray','languages'];
 const guide=location.pathname.includes('/assets/banners/')?'../../../docs/PUBLISHING.md':'PUBLISHING.md';
 root.innerHTML=`<div class="gallery"><h1>DeskStickyNotes · 发布素材</h1><p>0.6.0 / 中英文封面、功能展示和 2× 原始界面图。展示图使用真实编译控件和示例内容，未读取个人便签。图片、文案和源文件均可复用；下载链接请始终使用官方 GitHub Release。</p><nav class="toolbar"><a href="${guide}">渠道与发布文案</a><a href="?scene=hero&lang=zh&format=social">中文分享封面</a><a href="?scene=hero&lang=en&format=social">English cover</a></nav><div class="grid">${['zh','en'].flatMap(l=>entries.map((s,i)=>`<a class="tile" href="?scene=${s}&lang=${l}"><img src="exports/${l}-${s}-1270x760.png" alt="${l} ${s}"><strong>${l==='zh'?messages.zh[s][0].replace('\n',''):messages.en[s][0].replace('\n',' ')}</strong><small>1270 × 760 · ${l==='zh'?'中文':'English'} · ${i===0?'Cover':'Feature'}</small></a>`)).join('')}</div><footer>原始图位于 raw/；平台规格核对日期 2026-11-06。未代发到第三方社区。</footer></div>`;
}
</script>
</html>
