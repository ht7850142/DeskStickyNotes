name: Windows build and regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build DeskStickyNotes.sln -c Release
      - name: Regression checks
        run: dotnet run --project tests/DeskStickyNotes.RegressionTests -c Release --no-build
